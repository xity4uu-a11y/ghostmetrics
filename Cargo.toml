[package]
name = "ghostmetrics"
version = "1.0.0"
edition = "2021"
description = "Privacy-first, zero-cookie web analytics in a single Rust binary with embedded columnar OLAP storage, ClickHouse bridge, and Alpine.js dashboard."
license = "MIT"
repository = "https://github.com/xity4uu-a11y/ghostmetrics"
readme = "README.md"
keywords = ["analytics", "privacy", "clickhouse", "axum", "self-hosted"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "ghostmetrics"
path = "src/main.rs"

[lib]
name = "ghostmetrics"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
