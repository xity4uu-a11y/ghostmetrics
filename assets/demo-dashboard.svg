<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-label="GhostMetrics 15-second animated dashboard demo showing 0.4ms OLAP queries, live SSE visitors, and No-Cookie Compliance Audit">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, Inter, Segoe UI, Roboto, sans-serif; }
      .mono { font-family: SF Mono, JetBrains Mono, ui-monospace, Consolas, monospace; }

      /* 15-second looping animations */
      .chart-line {
        stroke-dasharray: 820;
        stroke-dashoffset: 820;
        animation: drawLine 15s ease-in-out infinite;
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 820; }
        16% { stroke-dashoffset: 0; }
        92% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 820; }
      }

      .chart-area {
        opacity: 0;
        animation: fadeArea 15s ease-in-out infinite;
      }
      @keyframes fadeArea {
        0%, 10% { opacity: 0; }
        22%, 92% { opacity: 1; }
        100% { opacity: 0; }
      }

      .pulse-dot {
        animation: livePulse 2s ease-in-out infinite;
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      /* Live SSE visitor counter stepping: 14 -> 15 -> 16 -> 18 over 15s */
      .v1 { animation: step1 15s step-end infinite; }
      .v2 { animation: step2 15s step-end infinite; }
      .v3 { animation: step3 15s step-end infinite; }
      @keyframes step1 { 0%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
      @keyframes step2 { 0%, 33% { opacity: 0; } 34%, 66% { opacity: 1; } 67%, 100% { opacity: 0; } }
      @keyframes step3 { 0%, 66% { opacity: 0; } 67%, 100% { opacity: 1; } }

      /* Compliance Spotlight Overlay slides in at 52%-88% of 15s cycle */
      .audit-drawer {
        opacity: 0;
        transform: translateX(28px);
        animation: drawerCycle 15s ease-in-out infinite;
      }
      @keyframes drawerCycle {
        0%, 48% { opacity: 0; transform: translateX(28px); }
        54%, 88% { opacity: 1; transform: translateX(0px); }
        94%, 100% { opacity: 0; transform: translateX(28px); }
      }

      /* Progress bar across 15s loop */
      .timeline-fill {
        transform-origin: 36px 0;
        animation: progressBar 15s linear infinite;
      }
      @keyframes progressBar {
        0% { width: 0px; }
        100% { width: 1008px; }
      }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1080" height="580" rx="16" fill="#0E0E11"/>
  <rect x="16" y="16" width="1048" height="548" rx="12" fill="#FBFBFD" stroke="#27272D" stroke-width="1"/>

  <!-- Browser Window Top Chrome -->
  <rect x="16" y="16" width="1048" height="44" rx="12" fill="#FFFFFF"/>
  <rect x="16" y="48" width="1048" height="12" fill="#FFFFFF"/>
  <line x1="16" y1="60" x2="1064" y2="60" stroke="#E5E5EA" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="38" cy="38" r="5" fill="#D1D1D6"/>
  <circle cx="56" cy="38" r="5" fill="#D1D1D6"/>
  <circle cx="74" cy="38" r="5" fill="#D1D1D6"/>

  <!-- Brand & Controls Bar -->
  <rect x="98" y="27" width="22" height="22" rx="5" fill="#1D1D1F"/>
  <path d="M103 42 L107.2 37.4 L110.5 39.8 L115 33.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="128" y="43" fill="#1D1D1F" class="sans" font-size="14" font-weight="600">GhostMetrics</text>

  <!-- Site Pill -->
  <rect x="234" y="25" width="188" height="26" rx="6" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  <text x="246" y="42" fill="#1D1D1F" class="mono" font-size="11.5">demo.ghostmetrics.local</text>

  <!-- Range Segmented -->
  <rect x="434" y="25" width="150" height="26" rx="6" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  <rect x="472" y="27" width="34" height="22" rx="4" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
  <text x="453" y="42" text-anchor="middle" fill="#6E6E73" class="mono" font-size="11">24h</text>
  <text x="489" y="42" text-anchor="middle" fill="#1D1D1F" class="mono" font-size="11" font-weight="600">7d</text>
  <text x="527" y="42" text-anchor="middle" fill="#6E6E73" class="mono" font-size="11">30d</text>
  <text x="565" y="42" text-anchor="middle" fill="#6E6E73" class="mono" font-size="11">90d</text>

  <!-- OLAP Latency Pill -->
  <rect x="652" y="25" width="114" height="26" rx="13" fill="#F5F5F7" stroke="#E5E5EA" stroke-width="1"/>
  <text x="709" y="42" text-anchor="middle" fill="#1D1D1F" class="mono" font-size="11.5">OLAP: 0.40ms</text>

  <!-- No-Cookie Verified Pill -->
  <rect x="776" y="25" width="212" height="26" rx="13" fill="#EEF8F2" stroke="#C6E9D5" stroke-width="1"/>
  <circle cx="791" cy="38" r="3.5" fill="#1B7F46"/>
  <text x="802" y="42" fill="#1B7F46" class="sans" font-size="11.5" font-weight="600">No-Cookie Verified (0 Cookies)</text>

  <!-- KPI Cards Row -->
  <g transform="translate(36, 78)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="190" height="82" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="16" y="24" fill="#86868B" class="sans" font-size="11.5" font-weight="500">Unique Visitors</text>
    <text x="16" y="54" fill="#1D1D1F" class="sans" font-size="24" font-weight="600">12,480</text>
    <text x="16" y="72" fill="#86868B" class="mono" font-size="10.5">7d columnar scan</text>

    <!-- KPI 2 -->
    <rect x="204" y="0" width="190" height="82" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="220" y="24" fill="#86868B" class="sans" font-size="11.5" font-weight="500">Total Pageviews</text>
    <text x="220" y="54" fill="#1D1D1F" class="sans" font-size="24" font-weight="600">34,912</text>
    <text x="220" y="72" fill="#86868B" class="mono" font-size="10.5">1,420 custom events</text>

    <!-- KPI 3 -->
    <rect x="408" y="0" width="190" height="82" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="424" y="24" fill="#86868B" class="sans" font-size="11.5" font-weight="500">Bounce Rate</text>
    <text x="424" y="54" fill="#1D1D1F" class="sans" font-size="24" font-weight="600">33.8%</text>
    <text x="424" y="72" fill="#86868B" class="sans" font-size="10.5">Single-page visits</text>

    <!-- KPI 4 -->
    <rect x="612" y="0" width="190" height="82" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="628" y="24" fill="#86868B" class="sans" font-size="11.5" font-weight="500">Views / Visit</text>
    <text x="628" y="54" fill="#1D1D1F" class="sans" font-size="24" font-weight="600">2.80</text>
    <text x="628" y="72" fill="#86868B" class="sans" font-size="10.5">Avg duration 2m 14s</text>

    <!-- KPI 5 Live SSE -->
    <rect x="816" y="0" width="192" height="82" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="832" y="24" fill="#86868B" class="sans" font-size="11.5" font-weight="500">Active Now</text>
    <circle cx="990" cy="20" r="4" fill="#1B7F46" class="pulse-dot"/>
    <text x="832" y="54" fill="#1D1D1F" class="sans v1" font-size="24" font-weight="600">14</text>
    <text x="832" y="54" fill="#1D1D1F" class="sans v2" font-size="24" font-weight="600">16</text>
    <text x="832" y="54" fill="#1D1D1F" class="sans v3" font-size="24" font-weight="600">18</text>
    <text x="832" y="72" fill="#1B7F46" class="mono" font-size="10.5">SSE live /api/realtime</text>
  </g>

  <!-- Main Traffic Chart Card -->
  <g transform="translate(36, 174)">
    <rect x="0" y="0" width="1008" height="202" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="18" y="26" fill="#1D1D1F" class="sans" font-size="13.5" font-weight="600">Traffic Overview</text>
    <text x="18" y="42" fill="#86868B" class="mono" font-size="11">Embedded Columnar MergeTree Scan · 0.40ms · 7 daily partitions</text>

    <!-- Gridlines -->
    <g stroke="#EFEFF4" stroke-width="1">
      <line x1="56" y1="66" x2="984" y2="66"/>
      <line x1="56" y1="104" x2="984" y2="104"/>
      <line x1="56" y1="142" x2="984" y2="142"/>
      <line x1="56" y1="176" x2="984" y2="176"/>
    </g>

    <g fill="#86868B" class="mono" font-size="10.5" text-anchor="end">
      <text x="48" y="70">6.0k</text>
      <text x="48" y="108">4.0k</text>
      <text x="48" y="146">2.0k</text>
      <text x="48" y="180">0</text>
    </g>

    <!-- Animated Area + Stroke -->
    <path class="chart-area" d="M64 148 L216 132 L368 124 L520 108 L672 114 L824 88 L976 72 L976 176 L64 176 Z" fill="#1D1D1F" fill-opacity="0.06"/>
    <path class="chart-line" d="M64 148 L216 132 L368 124 L520 108 L672 114 L824 88 L976 72" fill="none" stroke="#1D1D1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="976" cy="72" r="4" fill="#1B7F46" class="pulse-dot"/>

    <g fill="#86868B" class="mono" font-size="10.5" text-anchor="middle">
      <text x="64" y="193">Day 1</text>
      <text x="216" y="193">Day 2</text>
      <text x="368" y="193">Day 3</text>
      <text x="520" y="193">Day 4</text>
      <text x="672" y="193">Day 5</text>
      <text x="824" y="193">Day 6</text>
      <text x="976" y="193">Today</text>
    </g>
  </g>

  <!-- Bottom Breakdown Cards -->
  <g transform="translate(36, 390)">
    <!-- Top Pages -->
    <rect x="0" y="0" width="496" height="148" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="16" y="24" fill="#1D1D1F" class="sans" font-size="13" font-weight="600">Top Pages</text>
    <rect x="16" y="36" width="380" height="22" rx="4" fill="#F5F5F7"/>
    <text x="24" y="51" fill="#1D1D1F" class="mono" font-size="11.5">/</text>
    <text x="480" y="51" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11.5">8,240  ·  31.2%</text>

    <rect x="16" y="64" width="248" height="22" rx="4" fill="#F5F5F7"/>
    <text x="24" y="79" fill="#1D1D1F" class="mono" font-size="11.5">/pricing</text>
    <text x="480" y="79" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11.5">4,910  ·  22.4%</text>

    <rect x="16" y="92" width="194" height="22" rx="4" fill="#F5F5F7"/>
    <text x="24" y="107" fill="#1D1D1F" class="mono" font-size="11.5">/docs/clickhouse</text>
    <text x="480" y="107" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11.5">3,620  ·  19.0%</text>

    <rect x="16" y="120" width="128" height="20" rx="4" fill="#F5F5F7"/>
    <text x="24" y="134" fill="#1D1D1F" class="mono" font-size="11.5">/signup</text>
    <text x="480" y="134" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11.5">2,415  ·  14.8%</text>

    <!-- SaaS Conversion Funnel Plugin -->
    <rect x="512" y="0" width="496" height="148" rx="10" fill="#FFFFFF" stroke="#E5E5EA" stroke-width="1"/>
    <text x="528" y="24" fill="#1D1D1F" class="sans" font-size="13" font-weight="600">SaaS Activation Funnel (Plugin)</text>
    <text x="992" y="24" text-anchor="end" fill="#1B7F46" class="mono" font-size="11.5">Overall: 12.1%</text>

    <text x="528" y="48" fill="#515154" class="sans" font-size="11.5">1. Landing Visit (/)</text>
    <text x="992" y="48" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11">8,240 (100%)</text>
    <rect x="528" y="54" width="464" height="6" rx="3" fill="#F5F5F7"/>
    <rect x="528" y="54" width="464" height="6" rx="3" fill="#2C2C2E"/>

    <text x="528" y="78" fill="#515154" class="sans" font-size="11.5">2. Pricing Inspection (/pricing)</text>
    <text x="992" y="78" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11">4,120 (50.0%)</text>
    <rect x="528" y="84" width="464" height="6" rx="3" fill="#F5F5F7"/>
    <rect x="528" y="84" width="232" height="6" rx="3" fill="#2C2C2E"/>

    <text x="528" y="108" fill="#515154" class="sans" font-size="11.5">3. Signup Started (/signup)</text>
    <text x="992" y="108" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11">2,140 (26.0%)</text>
    <rect x="528" y="114" width="464" height="6" rx="3" fill="#F5F5F7"/>
    <rect x="528" y="114" width="121" height="6" rx="3" fill="#2C2C2E"/>

    <text x="528" y="136" fill="#515154" class="sans" font-size="11.5">4. Account Created (signup_completed)</text>
    <text x="992" y="136" text-anchor="end" fill="#1D1D1F" class="mono" font-size="11">997 (12.1%)</text>
  </g>

  <!-- Animated Slide-Over Compliance Audit Spotlight (appears second half of 15s loop) -->
  <g class="audit-drawer">
    <rect x="650" y="72" width="402" height="466" rx="12" fill="#141417" stroke="#36363F" stroke-width="1.2"/>
    <text x="674" y="104" fill="#F5F5F7" class="sans" font-size="15" font-weight="600">No-Cookie Compliance Audit</text>
    <text x="674" y="122" fill="#A1A1A6" class="mono" font-size="11">LIVE RUNTIME ATTESTATION</text>

    <line x1="674" y1="138" x2="1028" y2="138" stroke="#26262C" stroke-width="1"/>

    <g font-size="12">
      <text x="674" y="168" fill="#D1D1D6" class="sans">HTTP Set-Cookie Headers</text>
      <rect x="944" y="152" width="84" height="22" rx="11" fill="#14261C" stroke="#245339"/>
      <text x="986" y="167" text-anchor="middle" fill="#3CC878" class="mono" font-size="11">PASS (0)</text>

      <text x="674" y="206" fill="#D1D1D6" class="sans">document.cookie / localStorage</text>
      <rect x="944" y="190" width="84" height="22" rx="11" fill="#14261C" stroke="#245339"/>
      <text x="986" y="205" text-anchor="middle" fill="#3CC878" class="mono" font-size="11">PASS (0)</text>

      <text x="674" y="244" fill="#D1D1D6" class="sans">Raw Visitor IPs Persisted</text>
      <rect x="944" y="228" width="84" height="22" rx="11" fill="#14261C" stroke="#245339"/>
      <text x="986" y="243" text-anchor="middle" fill="#3CC878" class="mono" font-size="11">PASS (0)</text>

      <text x="674" y="282" fill="#D1D1D6" class="sans">Tracker Script (/ghost.js)</text>
      <rect x="916" y="266" width="112" height="22" rx="11" fill="#14261C" stroke="#245339"/>
      <text x="972" y="281" text-anchor="middle" fill="#3CC878" class="mono" font-size="11">826 B (&lt; 900 B)</text>

      <text x="674" y="320" fill="#D1D1D6" class="sans">Visitor Hash Salt</text>
      <text x="1028" y="320" text-anchor="end" fill="#A1A1A6" class="mono" font-size="11">Daily 256-bit RAM</text>

      <text x="674" y="358" fill="#D1D1D6" class="sans">DNT &amp; Sec-GPC Honored</text>
      <rect x="944" y="342" width="84" height="22" rx="11" fill="#14261C" stroke="#245339"/>
      <text x="986" y="357" text-anchor="middle" fill="#3CC878" class="mono" font-size="11">ENABLED</text>
    </g>

    <line x1="674" y1="382" x2="1028" y2="382" stroke="#26262C" stroke-width="1"/>
    <text x="674" y="408" fill="#A1A1A6" class="mono" font-size="11">1-CLICK PORTABLE EXPORTS</text>
    <rect x="674" y="420" width="354" height="32" rx="6" fill="#1C1C21" stroke="#303038"/>
    <text x="851" y="440" text-anchor="middle" fill="#F5F5F7" class="mono" font-size="11.5">ClickHouse MergeTree SQL + JSONEachRow</text>
    <rect x="674" y="460" width="172" height="30" rx="6" fill="#1C1C21" stroke="#303038"/>
    <text x="760" y="479" text-anchor="middle" fill="#D1D1D6" class="mono" font-size="11">Sanitized CSV</text>
    <rect x="856" y="460" width="172" height="30" rx="6" fill="#1C1C21" stroke="#303038"/>
    <text x="942" y="479" text-anchor="middle" fill="#D1D1D6" class="mono" font-size="11">Markdown Digest</text>

